document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"a19e5fda-4cb9-4785-967a-5e2e545341ad\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"60a8023c-12e4-4150-876e-ecac9ab571e1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5edbc906-b12f-4069-a316-56724d2df487\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"3b6455f3-051c-40fd-b09b-084dbcec8875\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2fe5fb29-a2a6-4602-8997-019af62f1991\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b5085fab-d00f-475f-9ac3-3cd4c4ceb6bd\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f3e40895-60fb-4346-9f40-019de9d5b282\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* =============================================================================\n   STRATA · FLAGSHIP TIER\n   The elevated layer of the Strata design system, for flagship end-user apps.\n\n   Inherits Strata's foundation — the same token architecture, the same\n   \"color is information, never decoration\" discipline, the same light/dark\n   engine built on color-mix() against a flipping --cm base.\n\n   Elevates the surface for customer-facing product:\n     · Spectral serif display paired with Inter\n     · a navy + single-blue brand, soft mesh, glass, larger radii,\n       a premium navy-tinted shadow ladder, and refined motion.\n\n   The flagship reference (IMIN) carried 9 decorative accent hues + a 7-stop\n   rainbow gradient — 56 colors in all. This tier retires every decorative hue.\n   What survives: ONE brand navy, ONE interactive blue, and the THREE semantic\n   signals. The rainbow becomes a restrained 3-stop blue→navy brand gradient.\n   ============================================================================= */\n\n:root {\n  /* color-mix base — the surface tints blend into. Flips in dark mode so a\n     single tint recipe (color-mix(... N%, var(--cm))) reads correctly on both. */\n  --cm: #ffffff;\n\n  /* ---- ink: navy-tinted neutrals (warmer & more branded than flat gray) ---- */\n  --ink:   #1B2A41;   /* primary text — a hair off the brand navy */\n  --ink-2: #46536A;   /* body / secondary */\n  --ink-3: #76829A;   /* muted / captions */\n  --ink-4: #A7B1C3;   /* faint / disabled, eyebrows */\n  --on-ink:#ffffff;   /* text on navy/blue fills */\n\n  /* ---- surfaces ---- */\n  --surface:   #ffffff;   /* cards, sheets */\n  --surface-2: #FAFBFD;   /* table headers, insets */\n  --surface-3: #F3F6FB;   /* app canvas behind the mesh */\n  --line:   #E6EAF1;      /* hairlines, card borders */\n  --line-2: #DCE3ED;      /* stronger dividers, input borders */\n  --hover:  #F4F7FB;      /* row / ghost hover */\n\n  /* ---- BRAND · the disciplined core: navy + one blue ---- */\n  --primary:     #1D3557;   /* brand · primary buttons · headers */\n  --primary-700: #16293F;   /* primary hover (deeper) */\n  --primary-300: #41587C;   /* lighter navy for secondary text on tint */\n  --primary-tint:#EAF0F7;   /* navy wash — quiet emphasis surfaces */\n\n  --accent:      #0073E6;   /* THE interactive blue · links · active · focus */\n  --accent-700:  #0059B8;   /* accent hover */\n  --accent-tint: #E6F0FD;   /* selected / active wash */\n  --focus:       #0073E6;   /* focus ring color */\n\n  /* ---- SEMANTIC SIGNALS · meaning only, never decoration ---- */\n  --success: #1F9D62;  --success-700: #167A4C;  --success-tint: #E7F4EE;\n  --warning: #C77D11;  --warning-700: #9A5F0A;  --warning-tint: #FBF1E1;\n  --danger:  #D8453D;  --danger-700:  #B23029;  --danger-tint:  #FBEAE9;\n  --info:    var(--accent);\n\n  /* ---- the one expressive moment: a restrained brand gradient ----\n     replaces IMIN's 7-stop rainbow. Reserve for the logo mark, a hero rule,\n     or a single key surface. Never as a component default. */\n  --brand-grad: linear-gradient(120deg, #2FB2F3 0%, #0073E6 48%, #1D3557 100%);\n\n  /* ---- mesh canvas · two pale hues, no more ---- */\n  --mesh-a: #E6F1FB;   /* pale blue */\n  --mesh-b: #ECEBFF;   /* pale lavender */\n  --mesh-base: #F3F6FB;\n\n  /* ---- categorical ramp · DATA VISUALISATION ONLY ----\n     when a chart genuinely needs N series. Derived from the brand family +\n     the two warm semantics so it never feels like decorative confetti.\n     Do not use these for UI chrome. */\n  --cat-1: #1D3557;  --cat-2: #0073E6;  --cat-3: #2FB2F3;\n  --cat-4: #5E7596;  --cat-5: #1F9D62;  --cat-6: #C77D11;\n\n  /* ---- radii · softer & more generous than Core (elevated feel) ---- */\n  --radius-sm: 8px;\n  --radius:    12px;\n  --radius-lg: 16px;\n  --radius-xl: 20px;\n  --radius-pill: 999px;\n\n  /* ---- elevation · navy-tinted, four rungs ---- */\n  --shadow-sm: 0 1px 2px rgba(29,53,87,.05), 0 1px 3px rgba(29,53,87,.04);\n  --shadow:    0 2px 4px rgba(29,53,87,.04), 0 6px 16px rgba(29,53,87,.06);\n  --shadow-md: 0 4px 10px rgba(29,53,87,.06), 0 16px 36px rgba(29,53,87,.10);\n  --shadow-lg: 0 12px 28px rgba(29,53,87,.12), 0 32px 64px rgba(29,53,87,.16);\n\n  /* ---- type ---- */\n  --display: 'Spectral', Georgia, 'Times New Roman', serif;   /* headings, hero */\n  --sans:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n  --mono:    ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;\n\n  /* ---- motion ---- */\n  --ease: cubic-bezier(.2, .8, .3, 1);\n  --ease-out: cubic-bezier(.16, 1, .3, 1);\n\n  --header-h: 64px;\n  --maxw: 1320px;\n  font-synthesis-weight: none;\n}\n\n/* ============================ DARK TIER ============================\n   Strata's foundation: dark mode is an attribute swap, not a second\n   stylesheet. Re-point the neutrals, surfaces, and --cm; every\n   color-mix() tint re-derives automatically. Brand blue lifts slightly\n   for contrast on deep navy. */\n[data-theme=\"dark\"] {\n  --cm: #0E1626;\n\n  --ink:   #EAF0F8;\n  --ink-2: #AEBACC;\n  --ink-3: #7D8AA0;\n  --ink-4: #56627A;\n  --on-ink:#ffffff;\n\n  --surface:   #15203360;   /* glass over the canvas */\n  --surface-2: #1A2740;\n  --surface-3: #0E1626;\n  --line:   #243150;\n  --line-2: #2E3D5F;\n  --hover:  #1B2840;\n\n  --primary:     #2C5A9E;   /* navy reads lighter on dark */\n  --primary-700: #21477E;\n  --primary-300: #6E8CB8;\n  --primary-tint:#17263F;\n\n  --accent:      #3D9BFF;\n  --accent-700:  #2B82E0;\n  --accent-tint: #142A47;\n  --focus:       #3D9BFF;\n\n  --success: #34B074; --success-700: #28925E; --success-tint: #122A22;\n  --warning: #E0A03A; --warning-700: #BE831F; --warning-tint: #2A2114;\n  --danger:  #F0625A; --danger-700:  #CE463E; --danger-tint:  #2C1715;\n\n  --brand-grad: linear-gradient(120deg, #2FB2F3 0%, #3D9BFF 48%, #6E8CB8 100%);\n\n  --mesh-a: #11203A;\n  --mesh-b: #1A1638;\n  --mesh-base: #0E1626;\n\n  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);\n  --shadow:    0 2px 4px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.45);\n  --shadow-md: 0 6px 16px rgba(0,0,0,.5), 0 20px 44px rgba(0,0,0,.5);\n  --shadow-lg: 0 16px 40px rgba(0,0,0,.6), 0 40px 80px rgba(0,0,0,.6);\n}\n\n/* ============================ BASE ============================ */\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\nbody {\n  font-family: var(--sans);\n  color: var(--ink);\n  background: var(--mesh-base);\n  font-size: 14px;\n  line-height: 1.45;\n  letter-spacing: -0.006em;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\nbutton { font-family: inherit; cursor: pointer; }\na { color: inherit; text-decoration: none; }\n::selection { background: color-mix(in oklch, var(--accent) 22%, transparent); }\n\n/* soft radial mesh — fixed behind everything. Two hues only. */\n.mesh-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: var(--mesh-base); }\n.mesh-bg::before {\n  content: \"\"; position: absolute; inset: -20%;\n  background:\n    radial-gradient(40% 38% at 12% 8%,  color-mix(in oklch, var(--mesh-a) 92%, transparent), transparent 70%),\n    radial-gradient(46% 42% at 88% 4%,  color-mix(in oklch, var(--mesh-b) 88%, transparent), transparent 72%),\n    radial-gradient(42% 40% at 78% 60%, color-mix(in oklch, var(--mesh-a) 70%, transparent), transparent 70%),\n    radial-gradient(50% 46% at 22% 80%, color-mix(in oklch, var(--mesh-b) 64%, transparent), transparent 72%);\n}\n\n/* ============================ TYPE ============================ */\n.display { font-family: var(--display); font-weight: 700; letter-spacing: -.02em; line-height: 1.06; color: var(--ink); }\n.display em { font-style: italic; font-weight: 600; }   /* the signature flourish */\nh1.display { font-size: 46px; }\nh2.display { font-size: 30px; letter-spacing: -.015em; }\nh3.display { font-size: 22px; letter-spacing: -.01em; line-height: 1.2; }\n\n.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }\n.overline { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }\n.lede { font-size: 16.5px; line-height: 1.55; color: var(--ink-2); }\n.muted { color: var(--ink-3); }\n.mono { font-family: var(--mono); }\n\n/* ============================ BUTTONS ============================ */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 7px;\n  height: 38px; padding: 0 16px; border-radius: var(--radius-sm);\n  font-size: 13.5px; font-weight: 550; letter-spacing: -.01em;\n  border: 1px solid transparent; white-space: nowrap;\n  transition: transform .12s var(--ease), box-shadow .15s, background .15s, border-color .15s, color .15s;\n}\n.btn svg { width: 16px; height: 16px; flex: none; }\n.btn:active { transform: translateY(0); }\n.btn-primary { background: var(--primary); color: var(--on-ink); box-shadow: 0 1px 2px rgba(29,53,87,.18); }\n.btn-primary:hover { background: var(--primary-700); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(29,53,87,.26); }\n.btn-accent { background: var(--accent); color: var(--on-ink); box-shadow: 0 1px 2px rgba(0,115,230,.22); }\n.btn-accent:hover { background: var(--accent-700); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,115,230,.30); }\n.btn-secondary { background: var(--surface); border-color: var(--line-2); color: var(--ink); box-shadow: var(--shadow-sm); }\n.btn-secondary:hover { background: var(--hover); border-color: color-mix(in oklch, var(--ink) 18%, var(--cm)); transform: translateY(-1px); }\n.btn-ghost { background: transparent; color: var(--ink-2); }\n.btn-ghost:hover { background: var(--hover); color: var(--ink); }\n.btn-sm { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 7px; }\n.btn-sm svg { width: 14px; height: 14px; }\n.btn-lg { height: 44px; padding: 0 22px; font-size: 15px; }\n.btn-icon { width: 38px; padding: 0; border-radius: var(--radius-sm); }\n.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }\n\n/* ============================ CARDS ============================ */\n.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }\n.card-pad { padding: 20px 22px; }\n.card-hover { transition: transform .15s var(--ease), box-shadow .2s, border-color .2s; }\n.card-hover:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--line-2); }\n.card-title { font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: -.01em; }\n\n/* glass surface (sidebars, sticky headers) */\n.glass { background: color-mix(in oklch, var(--surface) 72%, transparent); backdrop-filter: blur(12px) saturate(1.1); -webkit-backdrop-filter: blur(12px) saturate(1.1); }\n\n/* ============================ CHIPS / BADGES / STATUS ============================ */\n.chip {\n  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px;\n  border-radius: var(--radius-pill); font-size: 12.5px; font-weight: 500;\n  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); transition: .15s;\n}\n.chip:not(.on):hover { background: var(--hover); }\n.chip.on { background: var(--primary); border-color: var(--primary); color: var(--on-ink); }\n\n.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: -.01em; }\n.badge-neutral { background: var(--surface-3); color: var(--ink-2); border: 1px solid var(--line); }\n.badge-brand   { background: var(--primary-tint); color: var(--primary); }\n.badge-accent  { background: var(--accent-tint);  color: var(--accent-700); }\n.badge-success { background: var(--success-tint);  color: var(--success-700); }\n.badge-warning { background: var(--warning-tint);  color: var(--warning-700); }\n.badge-danger  { background: var(--danger-tint);   color: var(--danger-700); }\n\n/* status pill with leading dot */\n.status { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px 0 8px; border-radius: var(--radius-pill); font-size: 11.5px; font-weight: 550; }\n.status .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }\n.status-success { background: var(--success-tint); color: var(--success-700); }   .status-success .dot { background: var(--success); }\n.status-warning { background: var(--warning-tint); color: var(--warning-700); }   .status-warning .dot { background: var(--warning); }\n.status-danger  { background: var(--danger-tint);  color: var(--danger-700); }    .status-danger  .dot { background: var(--danger); }\n.status-neutral { background: var(--surface-3);    color: var(--ink-2); }          .status-neutral .dot { background: var(--ink-4); }\n\n/* ============================ FORMS ============================ */\n.field { display: flex; flex-direction: column; gap: 6px; }\n.label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }\n.input, .select, .textarea {\n  height: 40px; padding: 0 13px; width: 100%;\n  border: 1px solid var(--line-2); border-radius: var(--radius-sm);\n  background: var(--surface); color: var(--ink); font-family: inherit; font-size: 14px;\n  transition: border-color .15s, box-shadow .15s;\n}\n.textarea { height: auto; padding: 11px 13px; min-height: 88px; resize: vertical; line-height: 1.5; }\n.input::placeholder, .textarea::placeholder { color: var(--ink-4); }\n.input:focus, .select:focus, .textarea:focus {\n  outline: none; border-color: var(--accent);\n  box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 18%, transparent);\n}\n.input:hover, .select:hover, .textarea:hover { border-color: color-mix(in oklch, var(--ink) 22%, var(--cm)); }\n\n/* toggle */\n.switch { position: relative; width: 40px; height: 24px; border-radius: var(--radius-pill); background: var(--line-2); transition: background .18s var(--ease); border: none; flex: none; }\n.switch::after { content: \"\"; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); transition: transform .18s var(--ease); }\n.switch.on { background: var(--accent); }\n.switch.on::after { transform: translateX(16px); }\n\n/* segmented control */\n.segmented { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-3); border: 1px solid var(--line); border-radius: var(--radius-sm); }\n.segmented button { border: none; background: transparent; height: 30px; padding: 0 14px; border-radius: 6px; font-size: 13px; font-weight: 550; color: var(--ink-3); transition: .14s; }\n.segmented button:hover { color: var(--ink); }\n.segmented button.on { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }\n\n/* ============================ AVATARS ============================ */\n.avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 600; font-size: 12px; flex: none; box-shadow: 0 0 0 2px var(--surface); }\n.avatar-stack { display: flex; }\n.avatar-stack .avatar { margin-left: -8px; }\n.avatar-stack .avatar:first-child { margin-left: 0; }\n\n/* ============================ TABLE ============================ */\n.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }\n.table th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); padding: 13px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }\n.table td { padding: 14px 16px; border-top: 1px solid var(--line); color: var(--ink-2); vertical-align: middle; }\n.table tbody tr:first-child td { border-top: none; }\n.table tbody tr { transition: background .12s; }\n.table tbody tr:hover { background: var(--surface-2); }\n\n/* ============================ MISC ============================ */\n.divider { height: 1px; background: var(--line); border: 0; }\n.grad-text { background: var(--brand-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }\n.grad-bar { background: var(--brand-grad); border-radius: var(--radius-pill); }\n.link { color: var(--accent); font-weight: 550; cursor: pointer; }\n.link:hover { text-decoration: underline; text-underline-offset: 3px; }\n.kbd { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: 5px; border: 1px solid var(--line-2); background: var(--surface); font-size: 11px; color: var(--ink-3); font-weight: 600; font-family: var(--mono); }\n\n/* navlink (app chrome) */\n.navlink { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); transition: .13s; border: 1px solid transparent; background: transparent; }\n.navlink:hover { background: color-mix(in oklch, var(--surface) 60%, transparent); color: var(--ink); }\n.navlink.active { color: var(--accent); background: var(--accent-tint); font-weight: 600; }\n\n/* motion utilities */\n@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n@keyframes pop  { from { opacity: 0; transform: translateY(-6px) scale(.985); } to { opacity: 1; transform: none; } }\n.rise { animation: rise .4s var(--ease) both; }\n.pop  { animation: pop .16s var(--ease) both; transform-origin: top; }\n@media (prefers-reduced-motion: reduce) { .rise, .pop { animation: none; } }\n<\u002Fstyle>\n<style>\n/* ===== styleguide chrome (doc-only; not part of the system) ===== */\n:root { --doc-side: 264px; --code-bg: #15203A; --code-ink: #D7DEEA; }\n.sg-app { display: grid; grid-template-columns: var(--doc-side) 1fr; min-height: 100vh; position: relative; z-index: 1; }\n\n/* sidebar */\n.sg-side { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); padding: 22px 16px 40px; }\n.sg-brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 18px; }\n.sg-logo { width: 34px; height: 34px; border-radius: 9px; background: var(--brand-grad); flex: none; display: grid; place-items: center; box-shadow: var(--shadow-sm); position: relative; }\n.sg-logo::after { content: \"\"; position: absolute; inset: 6px; border-radius: 5px; border: 1.5px solid rgba(255,255,255,.9); }\n.sg-brand .nm { font-family: var(--display); font-size: 18px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }\n.sg-brand .sub { font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-top: 4px; }\n.sg-navgrp { margin-top: 16px; }\n.sg-navgrp-t { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-4); padding: 0 10px 7px; }\n.sg-nav { display: flex; align-items: center; gap: 9px; height: 33px; padding: 0 11px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); cursor: pointer; transition: .12s; }\n.sg-nav:hover { background: var(--hover); color: var(--ink); }\n.sg-nav.on { background: var(--accent-tint); color: var(--accent); font-weight: 600; }\n.sg-side-foot { margin-top: 22px; padding: 0 10px; }\n\n/* theme toggle */\n.sg-theme { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-3); border: 1px solid var(--line); border-radius: 9px; width: 100%; }\n.sg-theme button { flex: 1; border: none; background: transparent; height: 30px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: .14s; }\n.sg-theme button.on { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }\n\n/* content */\n.sg-main { min-width: 0; }\n.sg-wrap { max-width: 940px; margin: 0 auto; padding: 0 52px 160px; }\n\n.sg-cover { padding: 70px 0 34px; border-bottom: 1px solid var(--line); }\n.sg-cover .gbar { height: 5px; width: 104px; margin-bottom: 28px; }\n.sg-cover h1 { font-size: 50px; margin: 0 0 18px; }\n.sg-cover .lede { max-width: 620px; }\n.sg-meta { display: flex; flex-wrap: wrap; gap: 30px; margin-top: 32px; }\n.sg-meta .k { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-4); }\n.sg-meta .v { font-size: 13.5px; font-weight: 600; color: var(--ink); margin-top: 4px; }\n\n.sg-sec { padding-top: 72px; }\n.sg-sec-head { margin-bottom: 28px; }\n.sg-sec-head .eb { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; }\n.sg-sec-head .eb .n { font-variant-numeric: tabular-nums; color: var(--ink-4); font-weight: 700; }\n.sg-sec-head h2 { margin: 0 0 9px; }\n.sg-sec-head p { font-size: 15px; line-height: 1.55; color: var(--ink-2); max-width: 680px; margin: 0; }\n.sg-sub { font-size: 12.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin: 42px 0 18px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }\n\n/* demo surface — subtle checker so transparency & elevation read */\n.demo { border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 30px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center;\n  background: linear-gradient(color-mix(in oklch, var(--surface) 55%, transparent), color-mix(in oklch, var(--surface) 55%, transparent)), repeating-conic-gradient(var(--surface-2) 0% 25%, var(--surface) 0% 50%) 0 0 / 18px 18px; }\n.demo.col { flex-direction: column; align-items: stretch; }\n.demo .lbl { width: 100%; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-4); }\n\n/* note */\n.note { display: flex; gap: 11px; padding: 14px 16px; border-radius: var(--radius); font-size: 13.5px; line-height: 1.5; background: var(--primary-tint); color: var(--primary-700); margin: 18px 0; }\n.note.accent { background: var(--accent-tint); color: var(--accent-700); }\n.note.warn { background: var(--warning-tint); color: var(--warning-700); }\n.note b { font-weight: 650; }\n.note .ic { flex: none; font-size: 16px; line-height: 1.3; }\n\n/* color swatches */\n.sw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(154px, 1fr)); gap: 12px; }\n.sw { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); cursor: pointer; transition: .14s; }\n.sw:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }\n.sw .cap { height: 66px; border-bottom: 1px solid color-mix(in oklch, var(--ink) 8%, transparent); }\n.sw .meta { padding: 9px 11px 11px; }\n.sw .meta .nm { font-size: 12px; font-weight: 600; color: var(--ink); font-family: var(--mono); }\n.sw .meta .hex { font-size: 11px; color: var(--ink-3); margin-top: 3px; font-variant-numeric: tabular-nums; text-transform: uppercase; }\n.sw .meta .desc { font-size: 11px; color: var(--ink-4); margin-top: 5px; line-height: 1.35; }\n\n/* retired colors */\n.retired { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }\n.retired .rc { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 7px; border: 1px solid var(--line); border-radius: var(--radius-pill); font-size: 11.5px; color: var(--ink-3); background: var(--surface); }\n.retired .rc .sd { width: 13px; height: 13px; border-radius: 50%; position: relative; opacity: .5; }\n.retired .rc .sd::after { content: \"\"; position: absolute; inset: -3px -1px; border-top: 1.5px solid var(--ink-4); transform: rotate(-18deg); top: 50%; }\n.retired .rc .nm { text-decoration: line-through; text-decoration-color: var(--ink-4); }\n\n/* spec table */\n.spec { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }\n.spec th { text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 11px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }\n.spec td { padding: 12px 16px; border-top: 1px solid var(--line); color: var(--ink-2); vertical-align: middle; }\n.spec tr:first-child td { border-top: 0; }\n.spec td.tok { font-family: var(--mono); font-size: 12px; color: var(--ink); font-weight: 550; white-space: nowrap; }\n.spec td.val { font-variant-numeric: tabular-nums; white-space: nowrap; }\n\n/* type specimen */\n.tsp { display: flex; align-items: baseline; gap: 18px; padding: 18px 0; border-top: 1px solid var(--line); }\n.tsp:first-of-type { border-top: 0; }\n.tsp .tspx { flex: none; width: 130px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }\n.tsp .tspx b { display: block; color: var(--ink); font-size: 12px; margin-bottom: 2px; font-family: var(--sans); }\n\n/* token mini-cards */\n.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }\n.tcard { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px; }\n.tcard .tk { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink); }\n.tcard .tv { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-top: 3px; }\n\n/* code */\n.code { position: relative; background: var(--code-bg); border-radius: var(--radius); margin: 16px 0; overflow: hidden; box-shadow: var(--shadow-sm); }\n.code-bar { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,.08); }\n.code-bar .fn { font-size: 11px; font-weight: 600; color: #8693AB; font-family: var(--mono); }\n.code-copy { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); color: #A9B4C8; font-size: 11px; font-weight: 600; cursor: pointer; transition: .13s; }\n.code-copy:hover { background: rgba(255,255,255,.1); color: #fff; }\n.code pre { margin: 0; padding: 15px 16px; overflow-x: auto; font-size: 12.5px; line-height: 1.65; font-family: var(--mono); color: var(--code-ink); }\n.tk-tag { color: #7FB2F0; } .tk-attr { color: #C9A0F0; } .tk-str { color: #9ED4A8; } .tk-com { color: #5E6B82; } .tk-prop { color: #7FB2F0; } .tk-val { color: #E8C46A; }\n\n.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--surface); font-size: 13px; font-weight: 550; padding: 11px 17px; border-radius: var(--radius); box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: .22s var(--ease); z-index: 99; }\n.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }\n\n.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }\n@media (max-width: 1080px) { .sg-app { grid-template-columns: 1fr; } .sg-side { display: none; } .sg-wrap { padding: 0 28px 110px; } .grid2 { grid-template-columns: 1fr; } }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"mesh-bg\"><\u002Fdiv>\n<div class=\"sg-app\">\n  <!-- ============ SIDEBAR ============ -->\n  <aside class=\"sg-side glass\">\n    <div class=\"sg-brand\">\n      <div class=\"sg-logo\"><\u002Fdiv>\n      <div>\n        <div class=\"nm\">Strata<\u002Fdiv>\n        <div class=\"sub\">Flagship Tier<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <nav id=\"sgNav\"><\u002Fnav>\n    <div class=\"sg-side-foot\">\n      <div class=\"sg-theme\" id=\"themeToggle\">\n        <button data-theme-set=\"light\" class=\"on\">☀ Light<\u002Fbutton>\n        <button data-theme-set=\"dark\">☾ Dark<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- ============ MAIN ============ -->\n  <main class=\"sg-main\">\n    <div class=\"sg-wrap\">\n      <!-- COVER -->\n      <header class=\"sg-cover\">\n        <div class=\"grad-bar gbar\"><\u002Fdiv>\n        <h1 class=\"display\">The elevated tier,<br><em>built on the same bedrock.<\u002Fem><\u002Fh1>\n        <p class=\"lede\">Strata Flagship is the surface layer of the Strata system — the look reserved for flagship, customer-facing products. It keeps the foundation's token architecture and its one unbreakable rule (<b>color is information, never decoration<\u002Fb>), then raises the ceiling: a Spectral serif voice, a navy-and-blue brand, soft mesh, glass, and a premium shadow ladder.<\u002Fp>\n        <div class=\"sg-meta\">\n          <div class=\"mi\"><div class=\"k\">System<\u002Fdiv><div class=\"v\">Strata<\u002Fdiv><\u002Fdiv>\n          <div class=\"mi\"><div class=\"k\">Tier<\u002Fdiv><div class=\"v\">Flagship · end-user<\u002Fdiv><\u002Fdiv>\n          <div class=\"mi\"><div class=\"k\">Built on<\u002Fdiv><div class=\"v\">Strata Core foundation<\u002Fdiv><\u002Fdiv>\n          <div class=\"mi\"><div class=\"k\">Stylesheet<\u002Fdiv><div class=\"v mono\" style=\"font-family:var(--mono);font-size:12.5px\">strata-flagship.css<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fheader>\n\n      <!-- TIERS -->\n      <section class=\"sg-sec\" id=\"sec-tiers\">\n        <div class=\"sg-sec-head\">\n          <div class=\"eb eyebrow\"><span class=\"n\">01<\u002Fspan> The two tiers<\u002Fdiv>\n          <h2 class=\"display\">One system, two altitudes.<\u002Fh2>\n          <p>Strata serves apps at different levels. Both draw from one token architecture and the same color discipline, so the family always reads as one — but each tier is tuned to its audience.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"grid2\">\n          <div class=\"card card-pad\">\n            <div class=\"overline\" style=\"color:var(--ink-3)\">Core tier<\u002Fdiv>\n            <h3 class=\"display\" style=\"margin:8px 0 8px\">Developer &amp; support<\u002Fh3>\n            <p style=\"font-size:13.5px;color:var(--ink-2);margin:0 0 14px;line-height:1.55\">The internal foundation. Geist + Geist Mono, a monochrome canvas, a single tweakable accent, tight radii. Built for density, legibility, and speed.<\u002Fp>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n              <span class=\"badge badge-neutral\">Geist<\u002Fspan><span class=\"badge badge-neutral\">Monochrome<\u002Fspan><span class=\"badge badge-neutral\">Dense<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"card card-pad\" style=\"border-color:var(--accent);box-shadow:var(--shadow-md)\">\n            <div class=\"overline\" style=\"color:var(--accent)\">Flagship tier · this guide<\u002Fdiv>\n            <h3 class=\"display\" style=\"margin:8px 0 8px\">End-user product<\u002Fh3>\n            <p style=\"font-size:13.5px;color:var(--ink-2);margin:0 0 14px;line-height:1.55\">The elevated surface. Spectral display + Inter, a navy-and-blue brand, mesh and glass, generous radii and shadow. Built to feel crafted and premium.<\u002Fp>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n              <span class=\"badge badge-accent\">Spectral + Inter<\u002Fspan><span class=\"badge badge-brand\">Navy brand<\u002Fspan><span class=\"badge badge-accent\">Elevated<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"note accent\"><span class=\"ic\">◆<\u002Fspan><div><b>Shared spine.<\u002Fb> Token names (<code class=\"mono\">--ink<\u002Fcode>, <code class=\"mono\">--line<\u002Fcode>, <code class=\"mono\">--surface<\u002Fcode>, <code class=\"mono\">--success/--warning/--danger<\u002Fcode>) and the <code class=\"mono\">color-mix()<\u002Fcode> light/dark engine are identical across tiers. An engineer moving between a Core app and a Flagship app finds the same architecture underneath.<\u002Fdiv><\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- COLOR -->\n      <section class=\"sg-sec\" id=\"sec-color\">\n        <div class=\"sg-sec-head\">\n          <div class=\"eb eyebrow\"><span class=\"n\">02<\u002Fspan> Color<\u002Fdiv>\n          <h2 class=\"display\">Two brand blues. Three signals. Nothing decorative.<\u002Fh2>\n          <p>The flagship reference carried nine decorative accent hues and a seven-stop rainbow gradient — fifty-six colors in total. This tier retires every decorative hue. What remains earns its place: a brand navy, one interactive blue, and the three semantic signals.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"sg-sub\">Brand<\u002Fdiv>\n        <div class=\"sw-grid\" id=\"sw-brand\"><\u002Fdiv>\n\n        <div class=\"sg-sub\">Semantic signals — meaning only<\u002Fdiv>\n        <div class=\"sw-grid\" id=\"sw-semantic\"><\u002Fdiv>\n\n        <div class=\"sg-sub\">Neutrals &amp; surfaces<\u002Fdiv>\n        <div class=\"sw-grid\" id=\"sw-neutral\"><\u002Fdiv>\n\n        <div class=\"sg-sub\">The one expressive moment<\u002Fdiv>\n        <div class=\"demo col\">\n          <span class=\"lbl\">Brand gradient — <code class=\"mono\" style=\"text-transform:none\">--brand-grad<\u002Fcode> · logo, hero rule, one key surface. Never a component default.<\u002Fspan>\n          <div class=\"grad-bar\" style=\"height:14px;width:100%\"><\u002Fdiv>\n          <div style=\"font-family:var(--display);font-size:34px;font-weight:700\" class=\"grad-text\">Strata Flagship<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"note\"><span class=\"ic\">↘<\u002Fspan><div><b>The fix, made visible.<\u002Fb> The seven-stop rainbow became a restrained three-stop <span style=\"color:var(--accent)\">blue<\u002Fspan> → <span style=\"color:var(--primary)\">navy<\u002Fspan> fade. These hues were retired from the system:<\u002Fdiv><\u002Fdiv>\n        <div class=\"retired\" id=\"retired\"><\u002Fdiv>\n\n        <div class=\"code\">\n          <div class=\"code-bar\"><span class=\"fn\">tints derive, never hardcode<\u002Fspan><button class=\"code-copy\" data-copy=\"background: color-mix(in oklch, var(--accent) 12%, var(--cm));\">Copy<\u002Fbutton><\u002Fdiv>\n          <pre><span class=\"tk-com\">/* every tint blends into --cm, so it works in light AND dark */<\u002Fspan>\n<span class=\"tk-prop\">background<\u002Fspan>: <span class=\"tk-val\">color-mix(in oklch, var(--accent) 12%, var(--cm))<\u002Fspan>;<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- TYPOGRAPHY -->\n      <section class=\"sg-sec\" id=\"sec-type\">\n        <div class=\"sg-sec-head\">\n          <div class=\"eb eyebrow\"><span class=\"n\">03<\u002Fspan> Typography<\u002Fdiv>\n          <h2 class=\"display\">A serif voice for the things that matter.<\u002Fh2>\n          <p>The elevation is mostly here. <b>Spectral<\u002Fb>, a refined serif, carries display and headings — its italic is the signature flourish. <b>Inter<\u002Fb> does the working text. The contrast of serif headline over sans body is what reads as \"crafted.\"<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"demo col\" style=\"gap:0\">\n          <div class=\"tsp\"><div class=\"tspx\"><b>Display<\u002Fb>Spectral 700 · 50px<\u002Fdiv><div class=\"display\" style=\"font-size:46px\">Move with intent <em>and ease.<\u002Fem><\u002Fdiv><\u002Fdiv>\n          <div class=\"tsp\"><div class=\"tspx\"><b>H2<\u002Fb>Spectral 700 · 30px<\u002Fdiv><h2 class=\"display\" style=\"margin:0\">A heading in serif<\u002Fh2><\u002Fdiv>\n          <div class=\"tsp\"><div class=\"tspx\"><b>H3<\u002Fb>Spectral 600 · 22px<\u002Fdiv><h3 class=\"display\" style=\"margin:0\">Section subhead<\u002Fh3><\u002Fdiv>\n          <div class=\"tsp\"><div class=\"tspx\"><b>Lede<\u002Fb>Inter 400 · 16.5px<\u002Fdiv><div class=\"lede\" style=\"max-width:420px\">Supporting copy sets in Inter for clarity at length.<\u002Fdiv><\u002Fdiv>\n          <div class=\"tsp\"><div class=\"tspx\"><b>Body<\u002Fb>Inter 400 · 14px<\u002Fdiv><div style=\"max-width:420px\">The workhorse size for interface text, table cells, and descriptions across the product.<\u002Fdiv><\u002Fdiv>\n          <div class=\"tsp\"><div class=\"tspx\"><b>Eyebrow<\u002Fb>Inter 700 · 11px<\u002Fdiv><div class=\"eyebrow\">Overline label<\u002Fdiv><\u002Fdiv>\n          <div class=\"tsp\"><div class=\"tspx\"><b>Mono<\u002Fb>JetBrains 500 · 13px<\u002Fdiv><div class=\"mono\" style=\"font-size:13px;color:var(--ink-2)\">id · 4f2a · v2.4<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <table class=\"spec\" style=\"margin-top:18px\">\n          <thead><tr><th>Role<\u002Fth><th>Family<\u002Fth><th>Token<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td>Display &amp; headings<\u002Ftd><td>Spectral<\u002Ftd><td class=\"tok\">--display<\u002Ftd><\u002Ftr>\n            <tr><td>UI &amp; body<\u002Ftd><td>Inter<\u002Ftd><td class=\"tok\">--sans<\u002Ftd><\u002Ftr>\n            <tr><td>Code &amp; identifiers<\u002Ftd><td>JetBrains Mono<\u002Ftd><td class=\"tok\">--mono<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fsection>\n\n      <!-- SURFACES -->\n      <section class=\"sg-sec\" id=\"sec-surfaces\">\n        <div class=\"sg-sec-head\">\n          <div class=\"eb eyebrow\"><span class=\"n\">04<\u002Fspan> Surfaces &amp; elevation<\u002Fdiv>\n          <h2 class=\"display\">Soft light, generous corners, honest depth.<\u002Fh2>\n          <p>Flagship surfaces sit on a two-hue radial mesh. Radii are larger than Core and shadows are navy-tinted across four rungs, so elevation feels physical rather than drawn.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"sg-sub\">Radius<\u002Fdiv>\n        <div class=\"demo\">\n          <div style=\"display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end\">\n            <div style=\"text-align:center\"><div style=\"width:80px;height:64px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-sm)\"><\u002Fdiv><div class=\"mono\" style=\"font-size:11px;color:var(--ink-3);margin-top:8px\">sm · 8<\u002Fdiv><\u002Fdiv>\n            <div style=\"text-align:center\"><div style=\"width:80px;height:64px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius)\"><\u002Fdiv><div class=\"mono\" style=\"font-size:11px;color:var(--ink-3);margin-top:8px\">base · 12<\u002Fdiv><\u002Fdiv>\n            <div style=\"text-align:center\"><div style=\"width:80px;height:64px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-lg)\"><\u002Fdiv><div class=\"mono\" style=\"font-size:11px;color:var(--ink-3);margin-top:8px\">lg · 16<\u002Fdiv><\u002Fdiv>\n            <div style=\"text-align:center\"><div style=\"width:80px;height:64px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius-xl)\"><\u002Fdiv><div class=\"mono\" style=\"font-size:11px;color:var(--ink-3);margin-top:8px\">xl · 20<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"sg-sub\">Elevation<\u002Fdiv>\n        <div class=\"demo\">\n          <div style=\"display:flex;gap:26px;flex-wrap:wrap\">\n            <div style=\"text-align:center\"><div style=\"width:96px;height:72px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-sm)\"><\u002Fdiv><div class=\"mono\" style=\"font-size:11px;color:var(--ink-3);margin-top:10px\">sm<\u002Fdiv><\u002Fdiv>\n            <div style=\"text-align:center\"><div style=\"width:96px;height:72px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)\"><\u002Fdiv><div class=\"mono\" style=\"font-size:11px;color:var(--ink-3);margin-top:10px\">base<\u002Fdiv><\u002Fdiv>\n            <div style=\"text-align:center\"><div style=\"width:96px;height:72px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-md)\"><\u002Fdiv><div class=\"mono\" style=\"font-size:11px;color:var(--ink-3);margin-top:10px\">md<\u002Fdiv><\u002Fdiv>\n            <div style=\"text-align:center\"><div style=\"width:96px;height:72px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg)\"><\u002Fdiv><div class=\"mono\" style=\"font-size:11px;color:var(--ink-3);margin-top:10px\">lg<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"sg-sub\">Glass<\u002Fdiv>\n        <div class=\"demo\" style=\"background:var(--brand-grad)\">\n          <div class=\"glass card-pad\" style=\"border-radius:var(--radius-lg);border:1px solid rgba(255,255,255,.4);color:var(--ink)\">\n            <div class=\"card-title\">Frosted panel<\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--ink-2);margin-top:4px\">.glass over a vivid backdrop — for sidebars &amp; sticky headers.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- COMPONENTS -->\n      <section class=\"sg-sec\" id=\"sec-components\">\n        <div class=\"sg-sec-head\">\n          <div class=\"eb eyebrow\"><span class=\"n\">05<\u002Fspan> Components<\u002Fdiv>\n          <h2 class=\"display\">The elevated kit.<\u002Fh2>\n          <p>Every component below is styled entirely by <code class=\"mono\">strata-flagship.css<\u002Fcode>. Same class names you'd use in production — copy the markup straight out.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"sg-sub\">Buttons<\u002Fdiv>\n        <div class=\"demo\">\n          <button class=\"btn btn-primary\">Primary<\u002Fbutton>\n          <button class=\"btn btn-accent\">Accent<\u002Fbutton>\n          <button class=\"btn btn-secondary\">Secondary<\u002Fbutton>\n          <button class=\"btn btn-ghost\">Ghost<\u002Fbutton>\n          <button class=\"btn btn-primary btn-sm\">Small<\u002Fbutton>\n          <button class=\"btn btn-primary btn-lg\">Large<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div class=\"sg-sub\">Chips &amp; badges<\u002Fdiv>\n        <div class=\"demo\">\n          <span class=\"chip on\">All<\u002Fspan><span class=\"chip\">Active<\u002Fspan><span class=\"chip\">Archived<\u002Fspan>\n          <span style=\"width:18px\"><\u002Fspan>\n          <span class=\"badge badge-brand\">Brand<\u002Fspan><span class=\"badge badge-accent\">Accent<\u002Fspan><span class=\"badge badge-success\">Success<\u002Fspan><span class=\"badge badge-warning\">Warning<\u002Fspan><span class=\"badge badge-danger\">Danger<\u002Fspan><span class=\"badge badge-neutral\">Neutral<\u002Fspan>\n        <\u002Fdiv>\n\n        <div class=\"sg-sub\">Status<\u002Fdiv>\n        <div class=\"demo\">\n          <span class=\"status status-success\"><span class=\"dot\"><\u002Fspan>Operational<\u002Fspan>\n          <span class=\"status status-warning\"><span class=\"dot\"><\u002Fspan>Degraded<\u002Fspan>\n          <span class=\"status status-danger\"><span class=\"dot\"><\u002Fspan>Down<\u002Fspan>\n          <span class=\"status status-neutral\"><span class=\"dot\"><\u002Fspan>Idle<\u002Fspan>\n        <\u002Fdiv>\n\n        <div class=\"sg-sub\">Forms<\u002Fdiv>\n        <div class=\"demo col\" style=\"max-width:420px\">\n          <div class=\"field\"><label class=\"label\">Workspace name<\u002Flabel><input class=\"input\" value=\"Northwind Labs\"><\u002Fdiv>\n          <div class=\"field\"><label class=\"label\">Plan<\u002Flabel><select class=\"select\"><option>Team<\u002Foption><option>Business<\u002Foption><option>Enterprise<\u002Foption><\u002Fselect><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px\"><button class=\"switch on\" aria-label=\"toggle\"><\u002Fbutton><span style=\"font-size:13.5px;color:var(--ink-2)\">Email notifications<\u002Fspan><\u002Fdiv>\n          <div class=\"segmented\"><button class=\"on\">Day<\u002Fbutton><button>Week<\u002Fbutton><button>Month<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"sg-sub\">Card<\u002Fdiv>\n        <div class=\"demo\">\n          <div class=\"card card-hover card-pad\" style=\"max-width:300px\">\n            <div style=\"display:flex;align-items:center;gap:11px;margin-bottom:12px\">\n              <div class=\"avatar\" style=\"width:38px;height:38px;background:var(--primary)\">NL<\u002Fdiv>\n              <div><div class=\"card-title\">Northwind Labs<\u002Fdiv><div style=\"font-size:12px;color:var(--ink-3)\">12 members<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font-size:13px;color:var(--ink-2);margin:0 0 14px;line-height:1.5\">Hover to feel the lift — a 2px rise on the premium shadow ladder.<\u002Fp>\n            <div style=\"display:flex;gap:8px\"><button class=\"btn btn-accent btn-sm\">Open<\u002Fbutton><button class=\"btn btn-secondary btn-sm\">Share<\u002Fbutton><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"sg-sub\">Table<\u002Fdiv>\n        <table class=\"table\">\n          <thead><tr><th>Workspace<\u002Fth><th>Owner<\u002Fth><th>Status<\u002Fth><th>Plan<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td style=\"color:var(--ink);font-weight:550\">Northwind Labs<\u002Ftd><td>A. Okafor<\u002Ftd><td><span class=\"status status-success\"><span class=\"dot\"><\u002Fspan>Active<\u002Fspan><\u002Ftd><td>Enterprise<\u002Ftd><\u002Ftr>\n            <tr><td style=\"color:var(--ink);font-weight:550\">Pinecone Co<\u002Ftd><td>J. Rivera<\u002Ftd><td><span class=\"status status-warning\"><span class=\"dot\"><\u002Fspan>Trial<\u002Fspan><\u002Ftd><td>Team<\u002Ftd><\u002Ftr>\n            <tr><td style=\"color:var(--ink);font-weight:550\">Atlas Studio<\u002Ftd><td>M. Chen<\u002Ftd><td><span class=\"status status-neutral\"><span class=\"dot\"><\u002Fspan>Idle<\u002Fspan><\u002Ftd><td>Business<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fsection>\n\n      <!-- MOTION -->\n      <section class=\"sg-sec\" id=\"sec-motion\">\n        <div class=\"sg-sec-head\">\n          <div class=\"eb eyebrow\"><span class=\"n\">06<\u002Fspan> Motion<\u002Fdiv>\n          <h2 class=\"display\">Quick, soft, never showy.<\u002Fh2>\n          <p>One spring-like easing curve unifies the tier. Lifts are small; entrances are short. Motion confirms an action — it never performs.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"tcards\">\n          <div class=\"tcard\"><div class=\"tk\">--ease<\u002Fdiv><div class=\"tv\">cubic-bezier(.2,.8,.3,1)<\u002Fdiv><\u002Fdiv>\n          <div class=\"tcard\"><div class=\"tk\">--ease-out<\u002Fdiv><div class=\"tv\">cubic-bezier(.16,1,.3,1)<\u002Fdiv><\u002Fdiv>\n          <div class=\"tcard\"><div class=\"tk\">hover lift<\u002Fdiv><div class=\"tv\">translateY(-1 to -2px)<\u002Fdiv><\u002Fdiv>\n          <div class=\"tcard\"><div class=\"tk\">.rise / .pop<\u002Fdiv><div class=\"tv\">.4s / .16s entrances<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"note warn\"><span class=\"ic\">⚠<\u002Fspan><div><b>Respect reduced motion.<\u002Fb> All entrance utilities collapse under <code class=\"mono\">prefers-reduced-motion: reduce<\u002Fcode>. Never gate meaning on an animation.<\u002Fdiv><\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<div class=\"toast\" id=\"toast\">Copied<\u002Fdiv>\n\n\n\n<script>\n(function () {\n  /* ---- nav ---- */\n  var SECTIONS = [\n    { g: \"Foundations\", items: [[\"sec-tiers\",\"Two tiers\"],[\"sec-color\",\"Color\"],[\"sec-type\",\"Typography\"],[\"sec-surfaces\",\"Surfaces\"]] },\n    { g: \"Build\", items: [[\"sec-components\",\"Components\"],[\"sec-motion\",\"Motion\"]] },\n  ];\n  var nav = document.getElementById(\"sgNav\"), navEls = {};\n  SECTIONS.forEach(function (grp) {\n    var t = document.createElement(\"div\"); t.className = \"sg-navgrp\";\n    var h = document.createElement(\"div\"); h.className = \"sg-navgrp-t\"; h.textContent = grp.g; t.appendChild(h);\n    grp.items.forEach(function (it) {\n      var a = document.createElement(\"div\"); a.className = \"sg-nav\"; a.textContent = it[1];\n      a.onclick = function () { var el = document.getElementById(it[0]); window.scrollTo({ top: el.offsetTop - 24, behavior: \"smooth\" }); };\n      navEls[it[0]] = a; t.appendChild(a);\n    });\n    nav.appendChild(t);\n  });\n\n  /* ---- color data ---- */\n  function swatch(name, val, desc, dark) {\n    return '<div class=\"sw\" data-copy=\"var(' + name + ')\"><div class=\"cap\" style=\"background:var(' + name + ')\"><\u002Fdiv>'\n      + '<div class=\"meta\"><div class=\"nm\">' + name + '<\u002Fdiv><div class=\"hex\">' + val + '<\u002Fdiv>'\n      + (desc ? '<div class=\"desc\">' + desc + '<\u002Fdiv>' : '') + '<\u002Fdiv><\u002Fdiv>';\n  }\n  document.getElementById(\"sw-brand\").innerHTML = [\n    swatch(\"--primary\", \"#1D3557\", \"Brand · primary actions · headers\"),\n    swatch(\"--primary-700\", \"#16293F\", \"Primary hover\"),\n    swatch(\"--primary-tint\", \"#EAF0F7\", \"Quiet navy wash\"),\n    swatch(\"--accent\", \"#0073E6\", \"Interactive · links · active · focus\"),\n    swatch(\"--accent-700\", \"#0059B8\", \"Accent hover\"),\n    swatch(\"--accent-tint\", \"#E6F0FD\", \"Selected / active wash\"),\n  ].join(\"\");\n  document.getElementById(\"sw-semantic\").innerHTML = [\n    swatch(\"--success\", \"#1F9D62\", \"Positive state only\"),\n    swatch(\"--warning\", \"#C77D11\", \"Caution only\"),\n    swatch(\"--danger\", \"#D8453D\", \"Error / destructive only\"),\n  ].join(\"\");\n  document.getElementById(\"sw-neutral\").innerHTML = [\n    swatch(\"--ink\", \"#1B2A41\", \"Primary text\"),\n    swatch(\"--ink-2\", \"#46536A\", \"Body\"),\n    swatch(\"--ink-3\", \"#76829A\", \"Muted\"),\n    swatch(\"--surface\", \"#FFFFFF\", \"Cards & sheets\"),\n    swatch(\"--surface-3\", \"#F3F6FB\", \"App canvas\"),\n    swatch(\"--line\", \"#E6EAF1\", \"Hairlines\"),\n  ].join(\"\");\n\n  var RETIRED = [[\"Indigo\",\"#5568C7\"],[\"Violet\",\"#8A63C4\"],[\"Coral\",\"#F86566\"],[\"Orange\",\"#FF9A4E\"],[\"Lime\",\"#7FC457\"],[\"Pink\",\"#E068A7\"],[\"Teal\",\"#3EC0D7\"]];\n  document.getElementById(\"retired\").innerHTML = RETIRED.map(function (r) {\n    return '<span class=\"rc\"><span class=\"sd\" style=\"background:' + r[1] + '\"><\u002Fspan><span class=\"nm\">' + r[0] + '<\u002Fspan><\u002Fspan>';\n  }).join(\"\");\n\n  /* ---- copy ---- */\n  var toast = document.getElementById(\"toast\"), tt;\n  function showToast(msg) { toast.textContent = msg; toast.classList.add(\"show\"); clearTimeout(tt); tt = setTimeout(function () { toast.classList.remove(\"show\"); }, 1300); }\n  document.addEventListener(\"click\", function (e) {\n    var el = e.target.closest(\"[data-copy]\"); if (!el) return;\n    var v = el.getAttribute(\"data-copy\");\n    if (navigator.clipboard) navigator.clipboard.writeText(v);\n    showToast(\"Copied  \" + v);\n  });\n\n  /* ---- theme ---- */\n  document.getElementById(\"themeToggle\").addEventListener(\"click\", function (e) {\n    var b = e.target.closest(\"[data-theme-set]\"); if (!b) return;\n    var mode = b.getAttribute(\"data-theme-set\");\n    document.documentElement.setAttribute(\"data-theme\", mode);\n    this.querySelectorAll(\"button\").forEach(function (x) { x.classList.toggle(\"on\", x === b); });\n  });\n\n  /* ---- scroll spy ---- */\n  var ids = Object.keys(navEls);\n  function spy() {\n    var y = window.scrollY + 120, cur = ids[0];\n    ids.forEach(function (id) { var el = document.getElementById(id); if (el && el.offsetTop <= y) cur = id; });\n    ids.forEach(function (id) { navEls[id].classList.toggle(\"on\", id === cur); });\n  }\n  window.addEventListener(\"scroll\", spy, { passive: true }); spy();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
