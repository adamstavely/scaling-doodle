<!-- Every Trench Coat element inside takes the Clean look; data-tc-look on <html> only sets the tokens. -->
<tc-look-provider look="clean">
  <div class="shell">
    <tc-side-nav
      class="sidebar"
      data-tc-theme="dark"
      collapsible
      [items]="navItems"
      [current]="currentNav()"
      (tc-navigate)="onNavigate($event)"
    ></tc-side-nav>

    <!-- The navy bar spans the page: the brand, the search, then tc-header-nav at its right end. `inverse` draws them for
         the dark bar while the header nav's menus keep the page's light or dark theme. -->
    <header class="topbar">
      <tc-header-brand class="brand" inverse name="INTELLECT" href="/" [icon]="brandIcon" (tc-navigate)="onBrandNavigate($event)"></tc-header-brand>
      <!-- Loaded once the page is idle, so the command menu isn't part of every page's first download. -->
      @defer (on idle) {
        <app-search-box />
      } @placeholder {
        <span class="search-slot"></span>
      }
      <tc-header-nav inverse [user]="user()" [accountItems]="accountItems()" (tc-account-select)="onAccountSelect($event)">
        <!-- Empty until there's a notifications feed. -->
        <tc-notifications heading="Notifications" [items]="[]"></tc-notifications>
        <tc-app-picker label="Apps" [apps]="apps.config.value().apps" [current]="apps.config.value().current"></tc-app-picker>
      </tc-header-nav>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</tc-look-provider>
