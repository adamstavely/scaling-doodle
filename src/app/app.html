<div class="shell">
  <tc-side-nav
    class="sidebar"
    brand="Intellect"
    brand-href="/"
    collapsible
    [items]="navItems"
    [current]="currentNav()"
    (tc-navigate)="onNavigate($event)"
  ></tc-side-nav>

  <tc-header-nav
    class="topbar"
    [user]="user()"
    [accountItems]="accountItems()"
    (tc-account-select)="onAccountSelect($event)"
  ></tc-header-nav>

  <main class="content">
    <router-outlet />
  </main>
</div>
