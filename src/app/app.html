<div class="shell">
  <tc-side-nav
    class="sidebar"
    brand="Intellect"
    collapsible
    [items]="navItems"
    [current]="currentNav()"
    (tc-navigate)="onNavigate($event)"
  ></tc-side-nav>

  <header class="topbar">
    <tc-segmented-control
      aria-label="View as"
      [options]="viewOptions"
      [value]="session.viewAs()"
      (tc-value-change)="onViewChange($event)"
    ></tc-segmented-control>
    <tc-header-nav [user]="user()"></tc-header-nav>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
