<header class="page-head">
  <div class="title">
    <h1>Metrics Summary</h1>
    <span class="as-of">As of: {{ asOf }}</span>
  </div>
  <tc-select
    label="Reporting period"
    align="end"
    [options]="periodChoices"
    [value]="period()"
    (tc-value-change)="onPeriodChange($event)"
  ></tc-select>
</header>

<!-- Opened by a `?brief=<period>` link. -->
<app-brief-dialog
  [period]="isChief() ? brief() : undefined"
  (closed)="setDialog({ brief: null })"
  (periodChange)="setDialog({ brief: $event })"
/>

@if (error()) {
  <p role="alert" class="error">Couldn't load the portfolio. Is intellect-api running?</p>
}

@if (ready()) {
  <!-- One grid for the page, so card edges line up: Donovan and the charts down the main column, Mission Centers,
       unilateral vs. joint and the notes down the rail. Cards sharing a row stretch to its height. -->
  <div class="layout">
    <!-- Donovan, INTELLECT's AI, explains the page – by fixed rules for now; a model can write it later. -->
    <section class="donovan">
      @if (explainer(); as s) {
        <tc-ai-summary
          heading="Donovan"
          subject="Metrics Summary"
          [status]="explainerStatus()"
          [model]="'Donovan · rules, no model yet'"
          [generatedAt]="generatedAt()"
          [tldr]="s.tldr"
          [summary]="s.summary"
          [points]="s.points"
          [questions]="s.questions"
          [sources]="s.sources"
          (tc-cite-open)="openSource($event)"
          (tc-retry)="regenerate()"
        ></tc-ai-summary>
      }
    </section>

    <aside class="centers">
      <tc-priority-list
        momentum-label="Trend"
        heading="Mission Centers"
        description="Each center's topics rolled up · papers published last month and this month"
        name-label="Center"
        [hide]="centerHiddenColumns"
        no-filters
        [items]="centers()"
        [figures]="paperColumns"
        (tc-open)="openCenter($event)"
      ></tc-priority-list>
    </aside>

    <!-- The priority charts: four topics each, in priority order, each bar a topic's papers in the period stacked by
         the authors' centers. -->
    <div class="priorities">
      @for (chart of priorityCharts(); track chart.id) {
        <tc-bar-chart
          [heading]="chart.heading"
          [description]="papersNote()"
          layout="stacked"
          [series]="'center'"
          [sort]="false"
          [format]="'integer'"
          [data]="chart.bars"
          (tc-mark-click)="openTopicBar($event)"
        ></tc-bar-chart>
      }
    </div>

    <!-- Readership and citations within the period, every priority, stacked by the authors' centers. -->
    <div class="metrics">
      @for (chart of metricCharts(); track chart.id) {
        <tc-bar-chart
          [heading]="chart.heading"
          [description]="metricNote()"
          layout="stacked"
          [series]="'center'"
          [sort]="false"
          [format]="'compact'"
          [unit]="' ' + chart.unit"
          [data]="chart.bars"
          (tc-mark-click)="openTopicBar($event)"
        ></tc-bar-chart>
      }
    </div>

    <aside class="side">
      <tc-segmented-bar
        heading="Unilateral vs. joint research"
        [highlight]="'Joint'"
        sort="false"
        [description]="collaborationNote()"
        [data]="collaboration()"
      ></tc-segmented-bar>
    </aside>
  </div>
} @else if (!error()) {
  <div class="loading" aria-busy="true" aria-label="Loading the portfolio">
    <div class="layout">
      <tc-skeleton class="donovan" height="480" radius="12"></tc-skeleton>
      <tc-skeleton class="centers" height="480" radius="12"></tc-skeleton>
    </div>
  </div>
}
