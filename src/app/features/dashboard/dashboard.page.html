<header class="page-head">
  <div class="title">
    <h1>Metrics Summary</h1>
    <span class="as-of">As of: {{ asOf }}</span>
  </div>
  <tc-select
    label="Reporting period"
    align="end"
    [options]="periodChoices"
    [value]="period()"
    (tc-value-change)="onPeriodChange($event)"
  ></tc-select>
</header>

<!-- Opened by a `?brief=<period>` link. -->
<app-brief-dialog
  [period]="isChief() ? brief() : undefined"
  (closed)="setDialog({ brief: null })"
  (periodChange)="setDialog({ brief: $event })"
/>

@if (error()) {
  <p role="alert" class="error">Couldn't load the portfolio. Is intellect-api running?</p>
}

@if (ready()) {
  <div class="grid">
    <div class="main">
      <!-- Donovan, INTELLECT's AI, explains the page – by fixed rules for now; a model can write it later. -->
      @if (explainer(); as s) {
        <tc-ai-summary
          heading="Donovan"
          subject="Metrics Summary"
          [status]="explainerStatus()"
          [model]="'Donovan · rules, no model yet'"
          [generatedAt]="generatedAt()"
          [tldr]="s.tldr"
          [summary]="s.summary"
          [points]="s.points"
          [questions]="s.questions"
          [sources]="s.sources"
          (tc-cite-open)="openSource($event)"
          (tc-retry)="regenerate()"
        ></tc-ai-summary>
      }
    </div>

    <aside class="rail">
      <tc-priority-list
        momentum-label="Trend"
        heading="Mission Centers"
        description="Each center's topics rolled up · papers published last month and this month"
        name-label="Center"
        [hide]="centerHiddenColumns"
        no-filters
        [items]="centers()"
        [figures]="paperColumns"
        (tc-open)="openCenter($event)"
      ></tc-priority-list>
    </aside>
  </div>

  <!-- The bottom row: the priority charts – four topics each, in priority order, each bar a topic's papers in the period
       stacked by the authors' centers – then unilateral vs. joint research. -->
  <div class="bottom-row">
    @for (chart of priorityCharts(); track chart.id) {
      <tc-bar-chart
        [heading]="chart.heading"
        [description]="papersNote()"
        layout="stacked"
        [series]="'center'"
        [sort]="false"
        [format]="'integer'"
        [data]="chart.bars"
        (tc-mark-click)="openTopicBar($event)"
      ></tc-bar-chart>
    }
    <tc-segmented-bar
      heading="Unilateral vs. joint research"
      [highlight]="'Joint'"
      sort="false"
      [description]="collaborationNote()"
      [data]="collaboration()"
    ></tc-segmented-bar>
  </div>

  <!-- Readership and citations within the period, every priority, stacked by the authors' centers. -->
  <div class="metrics-row">
    @for (chart of metricCharts(); track chart.id) {
      <tc-bar-chart
        [heading]="chart.heading"
        [description]="metricNote()"
        layout="stacked"
        [series]="'center'"
        [sort]="false"
        [format]="'compact'"
        [unit]="' ' + chart.unit"
        [data]="chart.bars"
        (tc-mark-click)="openTopicBar($event)"
      ></tc-bar-chart>
    }
  </div>
} @else if (!error()) {
  <div class="loading" aria-busy="true" aria-label="Loading the portfolio">
    <div class="grid">
      <tc-skeleton height="480" radius="12"></tc-skeleton>
      <tc-skeleton height="480" radius="12"></tc-skeleton>
    </div>
  </div>
}
