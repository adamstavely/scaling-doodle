<header class="page-head">
  <h1>Metrics Summary</h1>
  <tc-select
    label="Reporting period"
    align="end"
    [options]="periodChoices"
    [value]="period()"
    (tc-value-change)="onPeriodChange($event)"
  ></tc-select>
</header>

<!-- Opened by a `?brief=<period>` link. -->
<app-brief-dialog
  [period]="isChief() ? brief() : undefined"
  (closed)="setDialog({ brief: null })"
  (periodChange)="setDialog({ brief: $event })"
/>

@if (error()) {
  <p role="alert" class="error">Couldn't load the portfolio. Is intellect-api running?</p>
}

@if (ready()) {
  <div class="grid">
    <div class="main">
      <tc-priority-list
        heading="Centers by priority"
        description="Each center's topics in each priority tier · papers published last month and this month"
        name-label="Center"
        open-unit="gaps"
        no-filters
        [items]="centerPriorities()"
        [tiers]="tiers"
        [figures]="paperColumns"
        (tc-open)="openCenterTier($event)"
      ></tc-priority-list>

      <tc-priority-list
        heading="Priorities"
        description="Topics most at risk first · papers published last month and this month"
        [items]="priorities()"
        [tiers]="tiers"
        [figures]="paperColumns"
        (tc-open)="openTopic($event)"
      ></tc-priority-list>
    </div>

    <aside class="rail">
      <tc-priority-list
        heading="Centers"
        description="Each center's topics rolled up · papers published last month and this month"
        name-label="Center"
        open-unit="gaps"
        no-filters
        [items]="centers()"
        [figures]="paperColumns"
        (tc-open)="openCenter($event)"
      ></tc-priority-list>

      <tc-segmented-bar
        heading="Unilateral vs. joint research"
        [highlight]="'Joint'"
        sort="false"
        [description]="collaborationNote()"
        [data]="collaboration()"
      ></tc-segmented-bar>
    </aside>
  </div>
} @else if (!error()) {
  <div class="loading" aria-busy="true" aria-label="Loading the portfolio">
    <div class="grid">
      <tc-skeleton height="480" radius="12"></tc-skeleton>
      <tc-skeleton height="480" radius="12"></tc-skeleton>
    </div>
  </div>
}
