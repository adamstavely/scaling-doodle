<header class="page-head">
  <div>
    <p class="eyebrow">{{ scopeLabel() }}</p>
    <h1>Portfolio Health</h1>
  </div>
  <div class="head-actions">
    <tc-segmented-control
      aria-label="Reporting period"
      [options]="periodChoices"
      [value]="period()"
      (tc-value-change)="onPeriodChange($event)"
    ></tc-segmented-control>
    @if (isChief()) {
      <tc-button label="Directorate brief" variant="secondary" (click)="setDialog({ brief: period() })"></tc-button>
    }
    <tc-button label="New topic" variant="primary" (click)="setDialog({ new: 'topic' })"></tc-button>
  </div>
</header>

<app-new-topic-dialog [open]="newParam() === 'topic'" (closed)="setDialog({ new: null })" (created)="onTopicCreated()" />
<app-brief-dialog
  [period]="isChief() ? brief() : undefined"
  (closed)="setDialog({ brief: null })"
  (periodChange)="setDialog({ brief: $event })"
/>

@if (error()) {
  <p role="alert" class="error">Couldn't load the portfolio. Is intellect-api running?</p>
}

@if (ready()) {
  <tc-ops-overview
    heading="Portfolio at a glance"
    [status]="status()"
    [health]="health()"
    [healthLabels]="healthLabels"
    [tiles]="tiles()"
  ></tc-ops-overview>

  <div class="grid">
    <div class="main">
      <tc-priority-list
        heading="Centers"
        description="Each center's topics rolled up · papers published last month and this month"
        name-label="Center"
        open-unit="gaps"
        no-filters
        [items]="centers()"
        [figures]="paperColumns"
        (tc-open)="openCenter($event)"
      ></tc-priority-list>

      <tc-coverage-matrix
        heading="Centers by priority"
        description="How each center's topics are doing in each priority tier · a cell shows its weakest topic"
        check-label="Center"
        total-label="On track"
        [checks]="centerPriorities().checks"
        [parts]="centerPriorities().parts"
        [coverage]="centerPriorities().coverage"
        [statusLabels]="centerPriorityLabels"
        default-status="none"
      ></tc-coverage-matrix>

      <tc-priority-list
        heading="Priorities"
        description="Topics most at risk first · papers published last month and this month"
        [items]="priorities()"
        [tiers]="tiers"
        [figures]="paperColumns"
        (tc-open)="openTopic($event)"
      ></tc-priority-list>
    </div>

    <aside class="rail">
      <tc-coverage-ring
        heading="Gap coverage"
        description="Share of open gaps with active work against them"
        caption="covered"
        unit="topics"
        unit-one="topic"
        [value]="coverage()"
        [segments]="healthSegments()"
      ></tc-coverage-ring>

      <tc-segmented-bar
        heading="Unilateral vs. joint research"
        [highlight]="'Joint'"
        sort="false"
        [description]="collaborationNote()"
        [data]="collaboration()"
      ></tc-segmented-bar>

      <tc-gap-exposure
        heading="Gaps needing attention"
        [gaps]="gaps()"
        [tiers]="tiers"
        (tc-open)="openGap($event)"
      ></tc-gap-exposure>

      <tc-results-list
        heading="Impact pulse"
        group="none"
        [results]="papers()"
        (tc-open)="openPaper($event)"
      ></tc-results-list>
    </aside>
  </div>
} @else if (!error()) {
  <div class="loading" aria-busy="true" aria-label="Loading the portfolio">
    <tc-skeleton height="96" radius="12"></tc-skeleton>
    <div class="grid">
      <tc-skeleton height="480" radius="12"></tc-skeleton>
      <tc-skeleton height="480" radius="12"></tc-skeleton>
    </div>
  </div>
}
