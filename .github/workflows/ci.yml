name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 doesn't install browsers on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm 11.4 crashes resolving this tree ("reading 'edgesOut'"); match package.json's packageManager.
      - run: npm install -g npm@11.21.2
      - run: npm ci
      - run: npm run lint:tc
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: intellect-web:ci
